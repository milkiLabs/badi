name: badi
description: Badi launcher for Linux applications.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0

executables:
  main: main
dependencies:
  adhan_dart: ^2.0.1
  dbus: ^0.8.0
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  hijri: ^3.0.1
  intl: ^0.20.3
  layer_shell:
    git:
      url: https://github.com/mattkae/layer_shell.dart.git
  lucide_icons_flutter: ^3.1.25
  material_ui: ^1.6.0
  riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  ffigen: ^22.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
