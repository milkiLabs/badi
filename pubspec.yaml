name: badi
description: Badi launcher for Linux applications.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0

executables:
  main: main
dependencies:
  dbus: ^0.8.0
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  layer_shell:
    git:
      url: https://github.com/mattkae/layer_shell.dart.git
  material_ui: ^1.6.0

dev_dependencies:
  ffigen: ^22.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
